events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Podman's embedded DNS resolver — re-resolve upstream hostnames every 10s
    # (prevents stale DNS cache causing 502s after backend container restarts)
    resolver 10.89.6.1 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name investments.knowledgenexus.ai localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API proxy → FastAPI backend
        # Use variable + resolver so nginx re-resolves aii-backend on each request
        # (prevents stale DNS cache causing 502s after backend restarts)
        location /api/ {
            set $backend "aii-backend";
            proxy_pass http://$backend:8385;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # SPA — serve index.html for all routes so React Router works
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
