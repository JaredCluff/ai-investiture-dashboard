events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Podman's embedded DNS resolver — re-resolve upstream hostnames every 10s
    # (prevents stale DNS cache causing 502s after backend container restarts)
    resolver 10.89.6.1 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Rate limiting — 30 requests/minute per IP, burst of 20
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    server {
        listen 80;
        server_name investments.knowledgenexus.ai localhost;

        root /usr/share/nginx/html;
        index index.html;

        # HTTP security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API proxy → FastAPI backend
        # Use variable + resolver so nginx re-resolves aii-backend on each request
        # (prevents stale DNS cache causing 502s after backend restarts)
        location /api/ {
            set $backend "aii-backend";
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://$backend:8385;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # PR agent (Spark chat) proxy → aii-pr-agent
        location /chat/ {
            set $pr_agent "aii-pr-agent";
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://$pr_agent:8390;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # SPA — serve index.html for all routes so React Router works
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
