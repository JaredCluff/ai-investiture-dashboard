services:
  # FastAPI backend — Alpaca + Paperclip proxy
  aii-backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: aii-backend
    ports:
      - "127.0.0.1:8385:8385"
    env_file:
      - /Users/jared.cluff/.ai-investiture/.env
    environment:
      PAPERCLIP_URL: "http://host.containers.internal:3100"
      PAPERCLIP_TOKEN: "${PAPERCLIP_TOKEN:-pcp_board_a403227daa3b2eeb9a689325bc0f6642162e2822cdf1f734}"
      PAPERCLIP_COMPANY_ID: "6299465e-f976-4dac-ba3d-a4dfb32f1a06"
      KN_RETRIEVAL_URL: "http://host.containers.internal:8003"
    volumes:
      - /Users/jared.cluff/.ai-investiture/agents:/data/agents:ro
      - /Users/jared.cluff/.ai-investiture/blog:/data/blog:ro
    extra_hosts:
      - "host.containers.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8385/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aii-net

  # nginx frontend — serves React SPA + proxies /api/ to backend
  dashboard:
    image: nginx:alpine
    container_name: ai-investiture-dashboard
    ports:
      - "8384:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - aii-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aii-net

networks:
  aii-net:
    driver: bridge
